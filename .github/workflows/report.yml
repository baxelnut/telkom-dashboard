name: Run Scheduled Report

on:
  # turn off auto-report, keep the manual 
  # schedule:
  #   - cron: "0 3 * * *" # 03:00 UTC → 10:00 WIB, daily (Monday filtered in script)
  workflow_dispatch: # manual back‑up trigger

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run report
        run: node scripts/sendReport.js
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TELKOM_DASHBOARD_EMAIL: ${{ secrets.TELKOM_DASHBOARD_EMAIL }}
          TELKOM_DASHBOARD_PASSWORD: ${{ secrets.TELKOM_DASHBOARD_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          TELEGRAM_CHANNEL_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_CHAT_ID }}
