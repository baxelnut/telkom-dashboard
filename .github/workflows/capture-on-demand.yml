name: Capture tables (on-demand)

on:
  workflow_dispatch:
    inputs:
      chatId:
        description: "Telegram chat_id to send screenshots to"
        required: true
      tables:
        description: "Comma list: aosodomoro,galaksi"
        required: false
        default: "aosodomoro,galaksi"

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install deps
        run: npm ci --omit=dev

      - name: 📸 Capture & send to Telegram
        run: node scripts/captureOnDemand.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELKOM_DASHBOARD_EMAIL: ${{ secrets.TELKOM_DASHBOARD_EMAIL }}
          TELKOM_DASHBOARD_PASSWORD: ${{ secrets.TELKOM_DASHBOARD_PASSWORD }}
          CHAT_ID: ${{ github.event.inputs.chatId }}
          TABLES: ${{ github.event.inputs.tables }}
          BASE_URL: https://rso2telkomdashboard.web.app
