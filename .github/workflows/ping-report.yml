name: 🧪 Ping Manual Report API Every Minute

on:
  schedule:
    - cron: "* * * * *" # every minute
  workflow_dispatch: # optional manual trigger via GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ⏱️ Trigger the API
        run: curl -s https://backend-baxelnuts.vercel.app/api/manual-send-report
